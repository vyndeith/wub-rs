[package]
name = "wublocker"
version = "0.1.0"
edition = "2021"
description = "Native Windows library to disable and enable Windows Update at every layer: services, scheduled tasks, group policy and WaaSMedic self-healing."
license = "MIT"
repository = "https://github.com/vyndeith/wub-rs"
keywords = ["windows", "windows-update", "wsus", "wuauserv", "waasmedic"]
categories = ["os::windows-apis"]

[dependencies]
sha1 = "0.11"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
]

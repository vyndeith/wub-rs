[package]
name = "wu-blocker"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wu-blocker"
path = "src/main.rs"

[dependencies]
sha1 = "0.11"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Shell",
]

[profile.release]
panic = "abort"
strip = true

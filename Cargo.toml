[package]
name = "wu-blocker"
version = "0.1.0"
edition = "2021"

[lib]
name = "wublocker"
path = "src/lib.rs"

[[bin]]
name = "wu-blocker"
path = "src/main.rs"

[[bin]]
name = "wu-blocker-gui"
path = "src/gui.rs"

[dependencies]
sha1 = "0.11"

[dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Services",
    "Win32_System_TaskScheduler",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
panic = "abort"
strip = true
